name: Code Review

on:
  pull_request:
    types: [opened, synchronize]


jobs:
  code-review:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure Codex
        run: |
          mkdir -p "$RUNNER_TEMP/codex-home"
      
          cat > "$RUNNER_TEMP/codex-home/config.toml" <<'EOF'
          default_permissions = "github-issues"
      
          [features]
          network_proxy = true
      
          [permissions.github-issues]
          extends = ":workspace"
      
          [permissions.github-issues.network]
          enabled = true
      
          [permissions.github-issues.network.domains]
          "api.github.com" = "allow"
          "github.com" = "allow"

          [permissions.github-issues.filesystem]
          ":workspace_roots" = { ".git" = "write" }
          EOF

      - name: Code Review
        uses: openai/codex-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-home: ${{ runner.temp }}/codex-home
          permission-profile: github-issues
          safety-strategy: drop-sudo
          model: "gpt-5.6-luna"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Please review this pull request and provide feedback on:
            - Code quality and best practices
            - Potential bugs or issues
            - Performance considerations
            - Security concerns
            - Test coverage

            Use the repository's CLAUDE.md for guidance on style and conventions. Be constructive and helpful in your feedback.

            Use `gh pr comment` with your Bash tool to leave your review as a comment on the PR.