name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        uses: actions/configure-pages@v5

      - name: Build application
        run: npm run build

      - name: Verify Pages artifact preparation
        run: node --test .github/scripts/prepare-pages.test.cjs

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run application browser tests
        run: >-
          npx playwright test tests/book-details.spec.ts tests/book-list.spec.ts
          tests/library.spec.ts tests/error-handling.spec.ts tests/theme.spec.ts
          tests/universe.spec.ts --project=chromium

      - name: Upload browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Prepare Pages paths and Angular route fallback
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: node .github/scripts/prepare-pages.cjs

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/angular-workshop-modern/browser

  deploy:
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
