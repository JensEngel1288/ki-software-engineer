<div class="mb-6 rounded-xl border border-divider bg-surface p-4">
  <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
    @if (allowSorting()) {
      <label class="grid gap-1 text-sm font-medium" (change)="emitFilters()"
        >Sort books
        <select [formField]="form.sort" class="form-control">
          <option value="default">Default order</option>
          <option value="title-asc">Title: A–Z</option>
          <option value="title-desc">Title: Z–A</option>
          <option value="author-asc">Author: A–Z</option>
          <option value="author-desc">Author: Z–A</option>
        </select>
      </label>
    }
    <label class="grid gap-1 text-sm font-medium" (input)="emitFilters()"
      >Filter by author
      <input type="text" [formField]="form.author" class="form-control" placeholder="Any author" />
    </label>
    <label class="grid gap-1 text-sm font-medium" (input)="emitFilters()"
      >Filter by publisher
      <input type="text" [formField]="form.publisher" class="form-control" placeholder="Any publisher" />
    </label>
    <label class="grid gap-1 text-sm font-medium" (input)="emitFilters()"
      >Minimum pages
      <input type="number" step="1" [formField]="form.minPages" class="form-control" placeholder="No minimum" />
    </label>
    <label class="grid gap-1 text-sm font-medium" (input)="emitFilters()"
      >Maximum pages
      <input type="number" step="1" [formField]="form.maxPages" class="form-control" placeholder="No maximum" />
    </label>
    <label class="grid gap-1 text-sm font-medium" (change)="emitFilters()"
      >Filter by reading status
      <select [formField]="form.readingStatus" class="form-control">
        <option value="">Any status</option>
        <option value="want-to-read">Want to read</option>
        <option value="reading">Reading</option>
        <option value="finished">Finished</option>
      </select>
    </label>
  </div>
  @if (invalidRange()) {
    <p role="alert" class="mt-3 text-sm text-accent">Minimum pages must not exceed maximum pages.</p>
  }
  <button type="button" (click)="clear()" class="text-link mt-4 text-sm font-medium">Reset filters</button>
</div>
