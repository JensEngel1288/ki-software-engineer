<form [formRoot]="form" class="rounded-xl border border-divider bg-surface p-5 sm:p-8">
  <div class="grid gap-5 sm:grid-cols-2">
    <label class="grid content-start gap-1 text-sm font-medium sm:col-span-2"
      >Title
      <input aria-label="Title" [formField]="form.title" class="form-control" />
      @if (form.title().touched() && form.title().invalid()) {
        <span class="text-accent">Enter a book title.</span>
      }
    </label>
    <label class="grid content-start gap-1 text-sm font-medium sm:col-span-2"
      >Subtitle
      <input [formField]="form.subtitle" class="form-control" />
    </label>
    <label class="grid content-start gap-1 text-sm font-medium"
      >Author
      <input [formField]="form.author" class="form-control" />
    </label>
    <label class="grid content-start gap-1 text-sm font-medium"
      >Publisher
      <input [formField]="form.publisher" class="form-control" />
    </label>
    <label class="grid content-start gap-1 text-sm font-medium"
      >ISBN
      <input [formField]="form.isbn" class="form-control" />
    </label>
    <label class="grid content-start gap-1 text-sm font-medium"
      >Page count
      <input type="number" step="1" [formField]="form.numPages" class="form-control" />
      @if (form.numPages().touched() && form.numPages().invalid()) {
        <span class="text-accent">Enter a whole number greater than zero.</span>
      }
    </label>
    <label class="grid content-start gap-1 text-sm font-medium"
      >Price
      <input [formField]="form.price" class="form-control" />
      <span class="font-normal text-muted">Include the currency as you want it displayed.</span>
    </label>
    <label class="grid content-start gap-1 text-sm font-medium"
      >Cover URL
      <input type="url" [formField]="form.cover" class="form-control" />
    </label>
    <label class="grid content-start gap-1 text-sm font-medium sm:col-span-2"
      >Description
      <textarea [formField]="form.abstract" rows="6" class="form-control"></textarea>
    </label>
  </div>
  <div class="mt-6 flex flex-wrap items-center gap-4">
    <button type="submit" class="button-primary" [disabled]="form().invalid() || form().submitting()">
      {{ submitLabel() }}
    </button>
    <a [routerLink]="cancelLink() ?? ['/books', book().id]" class="text-link">Cancel</a>
  </div>
</form>
